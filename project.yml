# XcodeGen spec for the Meander macOS app.
# Generate the project with:  xcodegen generate   (see scripts/bootstrap.sh)
# The app links MeanderKit (and transitively WhisperKit) from the local Swift package.
name: Meander
options:
  bundleIdPrefix: com.meander
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  MeanderKit:
    path: .

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    # Hardened runtime is required for Developer ID notarization.
    ENABLE_HARDENED_RUNTIME: YES
    # Set your team to sign for distribution; empty uses ad-hoc / personal team.
    DEVELOPMENT_TEAM: ""

targets:
  Meander:
    type: application
    platform: macOS
    sources:
      - path: Sources/MeanderApp
    dependencies:
      - package: MeanderKit
        product: MeanderKit
      # On-device LLM cleanup (MLX). Built via xcodebuild so the Metal shader
      # library is compiled (plain `swift build` can't). Beta / measurement.
      - package: MeanderKit
        product: MeanderMLX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meander.app
        PRODUCT_NAME: Meander
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sources/MeanderApp/Info.plist
      properties:
        CFBundleDisplayName: Meander
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        # Standalone app with a Dock icon; the menu-bar extra stays as a quick control.
        NSMicrophoneUsageDescription: "Meander records your voice to transcribe it into text."
    entitlements:
      path: Sources/MeanderApp/Meander.entitlements
      properties:
        # Not sandboxed: a global push-to-talk key (CGEventTap) and pasting into
        # other apps require access the App Sandbox does not permit.
        com.apple.security.device.audio-input: true
